version: '3.8'

services:
  # Server: LLM Inference with GPU
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: shjung-qwen3vl-server:v0.2
    container_name: qwen3vl-server-test
    ports:
      - "8005:8005"
    # user: 1019:1019
    environment:
      - MODEL_NAME=Qwen/Qwen3-VL-2B-Instruct
      - DEVICE_MAP=auto
      - TORCH_DTYPE=auto
      - PORT=8005
      - CUDA_VISIBLE_DEVICES=0  
    volumes:
      - /mnt/ssd1/shjung/huggingface:/root/.cache/huggingface
      - ./server:/app  # Mount source code for live development
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['3'] 
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    stdin_open: true
    networks:
      - qwen3vl-network

  # Client: Preprocessing + Vision Encoder + Gradio UI
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: shjung-qwen3vl-client:v0.2
    container_name: qwen3vl-client-test
    ports:
      - "7860:7860"
    # user: 1019:1019
    environment:
      - SERVER_URL=http://server:8005
      - MODEL_NAME=Qwen/Qwen3-VL-2B-Instruct
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - CUDA_VISIBLE_DEVICES=0  # 컨테이너 내부에서는 항상 0부터 시작
      - HF_HOME=/root/.cache/huggingface
      - TORCH_HOME=/root/.cache/torch
    volumes:
      - /mnt/ssd1/shjung/huggingface:/root/.cache/huggingface
      - /mnt/ssd1/shjung/tor  ch:/root/.cache/torch  # torch hub cache for emotion models
      - ./client:/app  # Mount source code for live development
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2'] 
              capabilities: [gpu]
    depends_on:
      server:
        condition: service_healthy
    networks:
      - qwen3vl-network

networks:
  qwen3vl-network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.240.0/24
